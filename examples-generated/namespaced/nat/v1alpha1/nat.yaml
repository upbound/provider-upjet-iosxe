apiVersion: nat.iosxe.m.upbound.io/v1alpha1
kind: NAT
metadata:
  annotations:
    meta.upbound.io/example-id: nat/v1alpha1/nat
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    insideSourceInterfaces:
    - id: "10"
      interfaces:
      - interface: GigabitEthernet4
        overload: true
    insideSourceStaticEntries:
    - globalIp: 203.0.113.1
      localIp: 10.0.0.1
    outsideSourceStaticEntries:
    - globalIp: 198.51.100.1
      localIp: 10.0.0.2
