apiVersion: aaa.iosxe.upbound.io/v1alpha1
kind: TACACSServer
metadata:
  annotations:
    meta.upbound.io/example-id: aaa/v1alpha1/tacacsserver
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    attributeAllowUnknown: true
    directedRequest: true
    directedRequestNoTruncate: true
    directedRequestRestricted: true
    encryption: "0"
    keySecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    timeout: 5
