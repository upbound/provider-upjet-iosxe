    iosxe_cli:
        subCategory: General
        description: 'This resources is used to configure arbitrary CLI commands. This should be considered a last resort in case YANG models are not available, as it cannot read the state and therefore cannot reconcile changes. The resource uses different Cisco IOS-XE RPC methods depending on the raw parameter:'
        name: iosxe_cli
        title: iosxe_cli Resource - terraform-provider-iosxe
        examples:
            - name: example
              manifest: |-
                {
                  "cli": "interface Loopback123\ndescription configured-via-cli\n"
                }
        argumentDocs:
            cli: (String) This attribute contains the CLI commands.
            config-ios-cli-rpc: RPC which supports all IOS native and non-native configuration CLIs regardless of whether they are modeled in YANG. However, configuration changes are non-transactional and no automatic rollback on failure is performed. NETCONF is used as a transport mechanism only.
            config-ios-cli-trans: RPC which provides transactional semantics with automatic rollback on failure. However, it only supports native IOS configuration CLIs that have corresponding IOS-XE YANG model support. This mode does not support non-native IOS config CLIs for features such as wireless, app-hosting, telemetry, etc.
            device: (String) A device name from the provider configuration.
            raw: (Boolean) Determines which RPC method is used to send CLI commands. When false (default), uses the transactional config-ios-cli-trans RPC which provides automatic rollback on failure but only supports native IOS CLIs with YANG model support. When true, uses the config-ios-cli-rpc RPC which supports all IOS native and non-native CLIs but without transactional guarantees or automatic rollback.
            raw = false: ', default)'
            raw = true: )
        importStatements: []
