name: CiscoDevNet/iosxe
resources:
    iosxe_aaa:
        subCategory: AAA
        description: This resource can manage the AAA configuration.
        name: iosxe_aaa
        title: iosxe_aaa Resource - terraform-provider-iosxe
        examples:
            - name: example
              manifest: |-
                {
                  "group_server_radius": [
                    {
                      "deadtime": 5,
                      "ip_radius_source_interface_loopback": 0,
                      "name": "T-Group",
                      "server_names": [
                        {
                          "name": "TESTRADIUS"
                        }
                      ]
                    }
                  ],
                  "group_server_tacacsplus": [
                    {
                      "ip_tacacs_source_interface_loopback": 0,
                      "name": "tacacs-group",
                      "server_names": [
                        {
                          "name": "tacacs_10.10.15.12"
                        }
                      ],
                      "vrf": "VRF1"
                    }
                  ],
                  "new_model": true,
                  "server_radius_dynamic_author": true,
                  "server_radius_dynamic_author_clients": [
                    {
                      "ip": "11.1.1.1",
                      "server_key": "abcd123",
                      "server_key_type": "0"
                    }
                  ],
                  "session_id": "common"
                }
        argumentDocs:
            "0": "-1440"
            "1": "-65535"
            common: ', unique'
            deadtime: (Number) Specify time in minutes to ignore an unresponsive server
            device: (String) A device name from the provider configuration.
            group_server_radius: (Attributes List) Radius server-group definition (see below for nested schema)
            group_server_tacacsplus: (Attributes List) Tacacs+ server-group definition (see below for nested schema)
            id: (String) The path of the object.
            ip: (String)
            ip_radius_source_interface_five_gigabit_ethernet: (String) Five GigabitEthernet
            ip_radius_source_interface_forty_gigabit_ethernet: (String) Forty GigabitEthernet
            ip_radius_source_interface_gigabit_ethernet: (String) GigabitEthernet IEEE 802.3z
            ip_radius_source_interface_hundred_gigabit_ethernet: (String) Hundred GigabitEthernet
            ip_radius_source_interface_loopback: (Number) Loopback interface
            ip_radius_source_interface_ten_gigabit_ethernet: (String) Ten Gigabit Ethernet
            ip_radius_source_interface_twenty_five_gigabit_ethernet: (String) Twenty Five GigabitEthernet
            ip_radius_source_interface_two_gigabit_ethernet: (String) Two GigabitEthernet
            ip_radius_source_interface_vlan: (Number) Iosxr Vlans
            ip_tacacs_source_interface_five_gigabit_ethernet: (String) Five GigabitEthernet
            ip_tacacs_source_interface_forty_gigabit_ethernet: (String) Forty GigabitEthernet
            ip_tacacs_source_interface_gigabit_ethernet: (String) GigabitEthernet IEEE 802.3z
            ip_tacacs_source_interface_hundred_gigabit_ethernet: (String) Hundred GigabitEthernet
            ip_tacacs_source_interface_loopback: (Number) Loopback interface
            ip_tacacs_source_interface_ten_gigabit_ethernet: (String) Ten Gigabit Ethernet
            ip_tacacs_source_interface_twenty_five_gigabit_ethernet: (String) Twenty Five GigabitEthernet
            ip_tacacs_source_interface_two_gigabit_ethernet: (String) Two GigabitEthernet
            ip_tacacs_source_interface_vlan: (Number) Iosxr Vlans
            local_authentication_max_fail_attempts: (Number) Max failed attempts to lock the user
            local_authentication_type: (String)
            local_authorization: (String)
            name: (String) Radius Server-group name with max string length 32
            new_model: (Boolean) Enable NEW access control commands and functions.(Disables OLD commands.)
            server_key: (String, Sensitive)
            server_key_type: '(String) - Choices: 0, 6, 7'
            server_key_wo: (String, Write-only) The write-only value of the attribute.
            server_key_wo_version: (Number) The write-only version of the attribute.
            server_names: (Attributes List) Name of radius server (see below for nested schema)
            server_radius_dynamic_author: (Boolean) Local server profile for RFC 3576 support
            server_radius_dynamic_author_clients: (Attributes List) Specify a RADIUS client (see below for nested schema)
            session_id: (String) AAA Session ID
            vrf: (String) Configure forwarding table
        importStatements:
            - terraform import iosxe_aaa.example ""
    iosxe_aaa_accounting:
        subCategory: AAA
        description: This resource can manage the AAA Accounting configuration.
        name: iosxe_aaa_accounting
        title: iosxe_aaa_accounting Resource - terraform-provider-iosxe
        examples:
            - name: example
              manifest: |-
                {
                  "identities": [
                    {
                      "name": "test",
                      "start_stop_broadcast": false,
                      "start_stop_group1": "GROUP1",
                      "start_stop_group2": "GROUP2",
                      "start_stop_group3": "GROUP3",
                      "start_stop_group4": "GROUP4",
                      "start_stop_group_broadcast": false,
                      "start_stop_group_logger": false
                    }
                  ],
                  "identity_default_start_stop_group1": "RADIUS-GROUP",
                  "identity_default_start_stop_group2": "RADIUS-GROUP2",
                  "identity_default_start_stop_group3": "RADIUS-GROUP3",
                  "identity_default_start_stop_group4": "RADIUS-GROUP4",
                  "networks": [
                    {
                      "id": "network1",
                      "start_stop_group1": "radius",
                      "start_stop_group2": "tacacs+"
                    }
                  ],
                  "system_guarantee_first": false,
                  "update_newinfo_periodic": 2880
                }
        argumentDocs:
            "0": "-15"
            "1": "-71582"
            action_type: '(String) - Choices: start-stop, stop-only'
            all: ', attributes'
            broadcast: (Boolean) Use Broadcast for Accounting
            commands: (Attributes List) For exec (shell) commands. (see below for nested schema)
            connections: (Attributes List) For outbound connections. (telnet, rlogin) (see below for nested schema)
            default: (Boolean)
            delete_mode: (String) Configure behavior when deleting/destroying the resource. Either delete the entire object (YANG container) being managed, or only delete the individual resource attributes configured explicitly and leave everything else as-is. Default value is all.
            device: (String) A device name from the provider configuration.
            dot1x: (Attributes List) Named Accounting list (max 31 characters, longer will be rejected). (see below for nested schema)
            dot1x_default_start_stop_broadcast: (Boolean) Use Broadcast for Accounting
            dot1x_default_start_stop_group_broadcast: (Boolean) Use Broadcast for Accounting
            dot1x_default_start_stop_group_logger: (Boolean) Use system logger for Accounting
            dot1x_default_start_stop_group1: (String) Use Server-group
            dot1x_default_start_stop_group2: (String) Use Server-group
            dot1x_default_start_stop_group3: (String) Use Server-group
            dot1x_default_start_stop_group4: (String) Use Server-group
            execs: (Attributes List) For starting an exec (shell). (see below for nested schema)
            group_broadcast: (Boolean) Use Broadcast for Accounting
            group_logger: (Boolean) Use system logger for Accounting
            group1_group: (String) Use Server-group
            group2_group: (String) Use Server-group
            group3_group: (String) Use Server-group
            group4_group: (String) Use Server-group
            id: (String) The path of the object.
            identities: (Attributes List) Named Accounting list (max 31 characters, longer will be rejected). (see below for nested schema)
            identity_default_start_stop_group1: (String) Use Server-group
            identity_default_start_stop_group2: (String) Use Server-group
            identity_default_start_stop_group3: (String) Use Server-group
            identity_default_start_stop_group4: (String) Use Server-group
            level: (Number) Enable level
            list_name: (String)
            name: (String)
            networks: (Attributes List) For network services. (PPP, SLIP, ARAP) (see below for nested schema)
            none: (Boolean) No accounting.
            start_stop_broadcast: (Boolean) Use Broadcast for Accounting
            start_stop_group_broadcast: (Boolean) Use Broadcast for Accounting
            start_stop_group_logger: (Boolean) Use system logger for Accounting
            start_stop_group1: (String) Use Server-group
            start_stop_group2: (String) Use Server-group
            start_stop_group3: (String) Use Server-group
            start_stop_group4: (String) Use Server-group
            start_stop_logger: (Boolean) Use system logger for Accounting
            stop_only_broadcast: (Boolean) Use Broadcast for Accounting
            stop_only_group1: (String) Use Server-group
            stop_only_group2: (String) Use Server-group
            stop_only_group3: (String) Use Server-group
            stop_only_group4: (String) Use Server-group
            stop_only_logger: (Boolean) Use system logger for Accounting
            system_guarantee_first: (Boolean) Guarantee system accounting as first record.
            update_newinfo_periodic: (Number) Periodic intervals to send accounting update records(in minutes)
